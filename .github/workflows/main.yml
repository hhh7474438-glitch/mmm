name: Follwerk Build System
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos and SDKs
        run: |
          # تحميل Theos فقط إذا لم يكن موجوداً
          if [ ! -d "~/theos" ]; then
            git clone --recursive https://github.com/theos/theos.git ~/theos
          fi
          
          # تحميل الـ SDKs داخل مجلد Theos الصحيح
          # سنستخدم حلاً يضمن عدم التكرار
          mkdir -p ~/theos/sdks
          curl -L https://github.com/theos/sdks/archive/master.tar.gz | tar -xz -C ~/theos/sdks --strip-components=1
          
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Build Follwerk Package
        run: |
          export THEOS=~/theos
          # بناء الحزمة بشكل نهائي
          make package FINALPACKAGE=1
        
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Follwerk-Installer
          path: packages/*.deb
