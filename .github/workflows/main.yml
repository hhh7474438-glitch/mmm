name: Build Security Dylib
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          # تنصيب ذايوس يدوياً لضمان الاستقرار
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Setup iOS SDK
        run: |
          # تحميل الـ SDKs كملف Zip وتفكيكها
          mkdir -p $HOME/theos/sdks
          curl -L "https://github.com/theos/sdks/archive/master.zip" -o sdks.zip
          unzip -q sdks.zip
          # نقل الـ SDK المطلوب فقط لتقليل المساحة
          mv sdks-master/iPhoneOS14.5.sdk $HOME/theos/sdks/
          rm -rf sdks-master sdks.zip
          echo "SDK Setup Complete"

      - name: Build Tweak
        run: |
          export THEOS=$HOME/theos
          # تنظيف أي بناء سابق والبدء ببناء جديد
          make clean
          make all FINALPACKAGE=1 codesign=0

      - name: Upload and Get Link
        run: |
          # البحث عن ملف الـ dylib ورفعه للحصول على رابط مباشر
          FILE_PATH=$(find .theos/obj -name "*.dylib" | head -n 1)
          if [ -z "$FILE_PATH" ]; then
            echo "Error: No dylib found! Check your Makefile and Tweak.x"
            exit 1
          fi
          echo "Dylib Found: $FILE_PATH"
          echo "------------------------------------------"
          # رفع الملف والحصول على رابط تحميل مباشر من bashupload
          curl https://bashupload.com/$(basename $FILE_PATH) --data-binary @"$FILE_PATH"
          echo -e "\n------------------------------------------"
