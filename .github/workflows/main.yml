name: Follwerk Build System
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Dependencies (ldid)
        run: |
          # تثبيت أدوات التوقيع اللازمة لملفات iOS
          brew install ldid xz

      - name: Setup Theos and SDKs
        run: |
          # تحميل بيئة Theos والـ SDKs الخاصة بآبل
          git clone --recursive https://github.com/theos/theos.git ~/theos
          mkdir -p ~/theos/sdks
          curl -L https://github.com/theos/sdks/archive/master.tar.gz | tar -xz -C ~/theos/sdks --strip-components=1
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Build Follwerk Dylib
        run: |
          export THEOS=~/theos
          # بناء المشروع وتحويل الكود إلى ملف dylib نهائي
          make FINALPACKAGE=1
        
      - name: Prepare Final Package
        run: |
          # إنشاء مجلد يجمع الـ dylib وملفات المشروع للتحميل
          mkdir -p output
          cp .theos/obj/Follwerk.dylib output/ 2>/dev/null || cp .theos/obj/arm64/Follwerk.dylib output/
          cp Makefile Tweak.x control output/
          
      - name: Upload Project and Dylib
        uses: actions/upload-artifact@v4
        with:
          name: Follwerk-Full-Project
          path: output/
