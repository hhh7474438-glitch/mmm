name: Build Security Dylib
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Dependencies
        run: |
          brew install ldid 

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Setup iOS SDK
        run: |
          mkdir -p $HOME/theos/sdks
          curl -L "https://github.com/theos/sdks/archive/master.zip" -o sdks.zip
          unzip -q sdks.zip
          mv sdks-master/iPhoneOS14.5.sdk $HOME/theos/sdks/
          rm -rf sdks-master sdks.zip

      - name: Build Tweak
        run: |
          export THEOS=$HOME/theos
          make clean
          make all FINALPACKAGE=1 codesign=0

      - name: Upload Dylib to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: SecurityHussein-Dylib  # اسم ملف الـ Zip اللي راح ينزل
          path: .theos/obj/*/SecurityHussein.dylib  # راح ياخذ الدايلب من أي معمارية انصنعت
