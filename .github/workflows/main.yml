name: Build Hussein Dylib
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Setup iOS SDK
        run: |
          mkdir -p ~/theos/sdks
          curl -L "https://github.com/theos/sdks/raw/master/iPhoneOS14.5.sdk.tar.xz" -o sdk.tar.xz
          tar -xf sdk.tar.xz -C ~/theos/sdks/
          rm sdk.tar.xz

      - name: Build Dylib
        run: |
          export THEOS=~/theos
          make all FINALPACKAGE=1

      - name: Save Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hussein-Security-Dylib
          path: .theos/obj/debug/HusseinSecurity.dylib
