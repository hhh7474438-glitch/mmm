name: Build Security Dylib
on: [push, pull_request]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Setup iOS SDK
        run: |
          # تحميل SDK واحد فقط لضمان السرعة والنجاح
          curl -LO https://github.com/theos/sdks/raw/master/iPhoneOS14.5.sdk.tar.xz
          mkdir -p $HOME/theos/sdks
          tar -xvf iPhoneOS14.5.sdk.tar.xz -C $HOME/theos/sdks
          rm iPhoneOS14.5.sdk.tar.xz

      - name: Build Tweak
        run: |
          export THEOS=$HOME/theos
          # بناء الملف النهائي بدون توقيع يدوي (لأنك ستدمجه لاحقاً)
          make all FINALPACKAGE=1

      - name: Upload and Get Link
        run: |
          # البحث عن الملف الناتج في مجلدات الـ OBJ
          FILE_PATH=$(find .theos/obj -name "*.dylib" | head -n 1)
          if [ -z "$FILE_PATH" ]; then
            echo "Error: No dylib found!"
            exit 1
          fi
          echo "Found dylib: $FILE_PATH"
          echo "------------------------------------------"
          # رفع الملف والحصول على رابط مباشر
          curl https://bashupload.com/$(basename $FILE_PATH) --data-binary @"$FILE_PATH"
          echo -e "\n------------------------------------------"
