name: Follwerk Build System
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # تم التحديث إلى v4

      - name: Setup Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Build the Hack (dylib)
        run: |
          export THEOS=~/theos
          make FINALPACKAGE=1

      - name: Upload Result
        uses: actions/upload-artifact@v4 # هذا هو التعديل الأساسي لحل المشكلة
        with:
          name: Hussein-Saad-Hack
          path: .theos/obj/debug/*.dylib
