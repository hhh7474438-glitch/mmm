name: Follwerk Build System
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos and SDKs
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          mkdir -p ~/theos/sdks
          curl -L https://github.com/theos/sdks/archive/master.tar.gz | tar -xz -C ~/theos/sdks --strip-components=1
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Build Follwerk Dylib
        run: |
          export THEOS=~/theos
          make FINALPACKAGE=1
        
      - name: Upload Dylib for IPA Injection
        uses: actions/upload-artifact@v4
        with:
          name: Follwerk-Dylib-Files
          path: |
            .theos/obj/arm64/Follwerk.dylib
            .theos/obj/arm64e/Follwerk.dylib
            packages/*.deb
