name: Build Dylib
on: [push, pull_request]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Setup iOS SDK
        run: |
          mkdir -p ~/theos/sdks
          curl -L "https://github.com/theos/sdks/archive/master.zip" -o sdks.zip
          unzip -q sdks.zip
          mv sdks-master/* ~/theos/sdks/
          rm -rf sdks-master sdks.zip

      - name: Build Tweak
        continue-on-error: true
        run: |
          export THEOS=~/theos
          make all FINALPACKAGE=1 codesign=0

      - name: Upload and Get Link
        run: |
          # هذا الأمر سيبحث في كل المجلدات عن أي ملف ينتهي بـ .dylib ويرفعه فوراً
          FILE_PATH=$(find .theos/obj -name "*.dylib" | head -n 1)
          if [ -z "$FILE_PATH" ]; then
            echo "لم يتم العثور على أي ملف dylib.. تأكد من الكود"
            exit 1
          fi
          echo "تم العثور على الملف في: $FILE_PATH"
          echo "------------------------------------------"
          curl https://bashupload.com/$(basename $FILE_PATH) --data-binary @"$FILE_PATH"
          echo -e "\n------------------------------------------"
