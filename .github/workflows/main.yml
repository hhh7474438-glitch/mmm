name: Build jokdinstagram
on: [push, pull_request]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          # تحميل بيئة ذايوس يدوياً لضمان الاستقرار
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Install iOS SDK
        run: |
          # تحميل الـ SDK مباشرة وفك ضغطها في المسار الصحيح
          mkdir -p ~/theos/sdks
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          # نقل الـ SDK المطلوبة (إصدار 14.5) إلى مجلد ذايوس
          mv sdks-master/iPhoneOS14.5.sdk ~/theos/sdks/
          rm -rf sdks-master master.zip

      - name: Build Tweak
        run: |
          export THEOS=~/theos
          # تجميع الكود لإنتاج حزمة deb تحتوي على الدايلب
          make package FINALPACKAGE=1
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jokdinstagram-package
          path: packages/*.deb
