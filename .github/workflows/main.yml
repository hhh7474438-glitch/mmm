name: Build Hussain Dylib
on: [push, pull_request]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=~/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Install SDK
        run: |
          mkdir -p ~/theos/sdks
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          mv sdks-master/*.sdk ~/theos/sdks/
          rm -rf master.zip sdks-master

      - name: Build Tweak
        run: |
          export THEOS=~/theos
          make FINALPACKAGE=1

      - name: Prepare Artifacts
        run: |
          mkdir -p output
          find .theos/obj/ -name "*.dylib" -exec cp {} output/ \;

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: Hussain-Edition-Dylib
          path: output/*.dylib
