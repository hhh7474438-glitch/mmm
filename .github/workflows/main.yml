name: Follwerk Build System
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          # تحميل Theos
          git clone --recursive https://github.com/theos/theos.git ~/theos
          # تحميل الـ SDK (نستخدم نظام iOS 14.5 كمثال مستقر للألعاب)
          git clone https://github.com/theos/sdks.git ~/theos/sdks
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Build Follwerk Package
        run: |
          export THEOS=~/theos
          # تنفيذ بناء الحزمة الكاملة (deb)
          make package FINALPACKAGE=1
        
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Follwerk-Installer
          # تعديل المسار ليشمل ملف الـ deb الناتج
          path: packages/*.deb
