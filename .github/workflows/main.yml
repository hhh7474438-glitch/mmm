name: Build Security Dylib
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Setup iOS SDK
        run: |
          mkdir -p $HOME/theos/sdks
          curl -L "https://github.com/theos/sdks/archive/master.zip" -o sdks.zip
          unzip -q sdks.zip
          mv sdks-master/iPhoneOS14.5.sdk $HOME/theos/sdks/
          rm -rf sdks-master sdks.zip

      - name: Build Tweak
        run: |
          export THEOS=$HOME/theos
          make clean
          make all FINALPACKAGE=1 codesign=0

      - name: Upload and Get Link
        run: |
          # البحث عن الدايلب في مجلد البناء
          FILE_PATH=$(find .theos/obj -name "SecurityHussein.dylib" | head -n 1)
          if [ -z "$FILE_PATH" ]; then
            echo "Error: No dylib found!"
            exit 1
          fi
          echo "Dylib Found: $FILE_PATH"
          echo "------------------------------------------"
          # رفع الملف والحصول على رابط مباشر
          curl https://bashupload.com/SecurityHussein.dylib --data-binary @"$FILE_PATH"
          echo -e "\n------------------------------------------"
