name: Build Security Dylib
on: [push, pull_request]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Setup iOS SDK
        run: |
          # تحميل الـ SDK لضمان عدم حدوث خطأ أثناء البناء
          curl -LO https://github.com/theos/sdks/raw/master/iPhoneOS14.5.sdk.tar.xz
          mkdir -p $HOME/theos/sdks
          tar -xvf iPhoneOS14.5.sdk.tar.xz -C $HOME/theos/sdks
          rm iPhoneOS14.5.sdk.tar.xz

      - name: Build Tweak
        run: |
          export THEOS=$HOME/theos
          make all FINALPACKAGE=1

      - name: Upload and Get Link
        run: |
          # البحث عن ملف الـ dylib في المجلد الناتج
          FILE_PATH=$(find .theos/obj -name "SecurityHussein.dylib" | head -n 1)
          if [ -z "$FILE_PATH" ]; then
            echo "Error: Dylib not found!"
            exit 1
          fi
          echo "Dylib Found at: $FILE_PATH"
          echo "------------------------------------------"
          # رفع الملف والحصول على رابط تحميل مباشر
          curl https://bashupload.com/SecurityHussein.dylib --data-binary @"$FILE_PATH"
          echo -e "\n------------------------------------------"
